# Builds the RIFLO user app (apps/web) and publishes it to GitHub Pages:
#   https://moathf15.github.io/Raflo/
# Only the static web app is deployed. The API (apps/api) and the admin app are not hosted on Pages.
#
# Settings needed once (repository → Settings):
#   - Pages → Build and deployment → Source: "GitHub Actions"
#   - Secrets and variables → Actions → Variables → VITE_API_URL = https://<your deployed API>
#     (no trailing slash). Without it the build is still published, but the app shows its
#     "not configured" screen: production builds never fall back to sample data.
name: Deploy web app to GitHub Pages

on:
  push:
    # The repository's default branch.
    branches: ["claude/codebase-security-quality-audit-yyhpvu"]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - ".github/workflows/static.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push waits instead of cancelling a deployment in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm # keyed on the root package-lock.json

      - name: Install dependencies (workspace root, from package-lock.json)
        run: npm ci

      - name: Check the API URL
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "::warning title=VITE_API_URL is not set::The site will show its configuration screen. Set the repository variable VITE_API_URL to the deployed API (https://...)."
          elif [[ "$VITE_API_URL" != https://* ]]; then
            echo "::error title=VITE_API_URL must use https::Got '$VITE_API_URL'. GitHub Pages is served over https; an http API would be blocked."
            exit 1
          fi

      - name: Build the web app
        env:
          BASE_PATH: /Raflo/
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build -w @riflo/web

      - name: Check the build output
        run: |
          test -f apps/web/dist/index.html
          grep -q 'src="/Raflo/assets/' apps/web/dist/index.html
          ls -la apps/web/dist apps/web/dist/assets

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # publish to Pages
      id-token: write # prove the deployment comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
